<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Crossing Voice Changer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <div class="nook-phone">
            <div class="header">
                <i data-lucide="signal" class="header-icon"></i>
                <span class="time" id="clock">12:00</span>
                <i data-lucide="battery-medium" class="header-icon"></i>
            </div>

            <div class="app-content">
                <div class="dialog-box-container">
                    <div class="character-name-tag">Message</div>
                    <div class="message-row">
                        <div class="dialog-box">
                            <div class="input-wrapper">
                                <textarea id="transcription-input" placeholder="Type here..."></textarea>
                                <div id="karaoke-display" style="display: none;"></div>
                            </div>
                            <button id="random-quote-btn" class="icon-only-button">
                                <i data-lucide="shuffle"></i>
                                <span class="tooltip-popup tooltip-left">Insert Random Quote</span>
                            </button>
                        </div>
                        <div class="robot-container">
                            <img id="robot-avatar" src="robot1.webp" alt="Robot Avatar">
                        </div>
                    </div>
                </div>

                <div class="settings-area" id="settings-area">
                    <div class="setting-group" style="grid-column: 1 / -1;">
                        <label>Synthesis Style</label>
                        <select id="synth-mode-selector" class="ac-select">
                            <option value="syllables" selected>Default</option>
                            <option value="characters">Animalese (Credit: Acedio)</option>
                            <option value="demon_sampled">Demon</option>
                            <option value="robot">Robot</option>
                            <option value="retro">Retro</option>
                            <option value="alien">Alien</option>
                            <option value="beast">Beast</option>
                            <option value="chorus">Chorus</option>
                            <option value="crystal">Crystal</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label>Pitch <span id="val-pitch">600</span></label>
                        <input type="range" id="pitch-slider" min="200" max="1200" value="600">
                    </div>
                    <div class="setting-group">
                        <label>Speed <span id="val-speed">0.14</span></label>
                        <input type="range" id="speed-slider" min="0.05" max="0.2" step="0.01" value="0.14">
                    </div>
                    <div class="setting-group">
                        <label>Timbre <span id="val-timbre">400</span></label>
                        <input type="range" id="timbre-slider" min="100" max="2000" value="400">
                    </div>
                    <div class="setting-group">
                        <label>
                            <div class="label-with-tooltip">
                                <div class="tooltip-container">
                                    <i data-lucide="help-circle" class="help-icon"></i>
                                    <span class="tooltip-popup">Controls silence length after punctuation marks
                                        (.,!?)</span>
                                </div>
                                Pause
                            </div>
                            <span id="val-text-pause">150 ms</span>
                        </label>
                        <input type="range" id="pause-slider" min="50" max="500" value="150">
                    </div>
                    <div class="setting-group">
                        <label>Pitch Variance <span id="val-variance">50</span></label>
                        <input type="range" id="variance-slider" min="0" max="150" value="50">
                    </div>
                    <div class="setting-actions">
                        <button id="reset-defaults-btn" class="text-button">
                            <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i> Restore Defaults
                        </button>
                    </div>
                </div>

                <div class="controls-area">
                    <button id="play-animalese-btn" class="ac-button play secondary" disabled>
                        <span class="icon-wrapper"><i data-lucide="dog"></i></span>
                        <span class="btn-text">Speak!</span>
                    </button>

                    <button id="download-btn" class="ac-button record" disabled>
                        <i data-lucide="download"></i> Download
                    </button>

                    <button id="export-timing-btn" class="ac-button record" style="background-color: #6c5ce7;" disabled>
                        <i data-lucide="file-json"></i> Export Timing
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>

</html>
